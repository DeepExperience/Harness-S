[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-s"
version = "0.1.0"
description = "Learning from Sibling Harnesses for Generalizable Agent Training"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["httpx>=0.27,<1", "PyYAML>=6,<7", "numpy>=1.26,<3"]

[project.optional-dependencies]
runtime = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3",
           "zstandard>=0.23", "docker>=7,<8", "sentence-transformers>=3,<6",
           "dressage-blackbox-server==1.1.0", "deepseek-harness-sdk==0.1.0rc7", "e2b"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
harness-s = "harness_s.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["appworld_grpo_scoring"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["harness_s*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
