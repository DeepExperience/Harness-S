      config: {"context": {"compaction": {"enabled": false, "max_tokens": 4096, "retain_ratio": 0.16, "threshold_ratio": 0.8}, "state_injection": {"max_chars": 1200, "mode": "on_change"}, "tool_result_pruner": {"enabled": false, "head_chars": 4096, "tail_chars": 1024, "threshold_chars": 8192}}, "hooks": [{"action": "warn", "condition": "duplicate_call_gte", "event": "after_tool", "id": "duplicate-execute-guidance", "message": "The same execute call repeated. Use its observed result or change the next call; when a broad API listing is empty, inspect a specific candidate API with api_docs.show_api_doc rather than repeating the listing.", "parameters": {"threshold": 2}}, {"action": "normalize_error", "condition": "last_error_is", "event": "after_tool", "id": "schema-error-recovery", "message": "A schema error occurred. Reopen the exact API schema, correct parameter names, types, required fields, or response extraction, and retry once with the corrected call; do not repeat the same arguments.", "parameters": {"kind": "schema_422"}}, {"action": "normalize_error", "condition": "last_error_is", "event": "after_tool", "id": "authentication-error-recovery", "message": "An authentication error occurred. Verify the app-specific login identifier, extract the access token from the login response, and pass only that token to the protected call; do not reuse the whole login object.", "parameters": {"kind": "authentication_401"}}, {"action": "normalize_error", "condition": "last_error_is", "event": "after_tool", "id": "local-error-recovery", "message": "A local execution error occurred. Read the complete exception, fix the exact variable or API name, and continue with the corrected operation; do not repeat identical code.", "parameters": {"kind": "python_or_api_exception"}}, {"action": "warn", "condition": "pagination_present", "event": "after_tool", "id": "pagination-continuation", "message": "A pagination cursor is present. Fetch the remaining pages before treating the collection as complete, then reconcile the full deduplicated set before acting or completing.", "parameters": {}}, {"action": "block", "condition": "pagination_present", "event": "before_complete", "id": "pagination-before-complete", "message": "Completion is blocked because a pagination cursor remains. Fetch all remaining pages and reconcile the complete set before completing.", "parameters": {}}], "memory": {"enabled": true, "fields": [{"clear": "episode_start", "extractor": "schema_error", "name": "schema_error", "render_label": "Last schema error", "type": "string"}, {"clear": "episode_start", "extractor": "pagination_cursor", "name": "pagination_cursor", "render_label": "Current pagination cursor", "type": "string"}, {"clear": "episode_start", "extractor": "authenticated_apps", "name": "authenticated_apps", "render_label": "Authenticated apps", "type": "string_list"}]}, "tool_view": {"description_suffix": "Use mcp__environment__execute for all AppWorld work; derive exact predicates, complete paginated evidence, current state, API parameters, and expected state changes before acting.", "error_normalization": false, "examples": ["Before selecting or aggregating, decompose the task predicate. Verify every relationship, attribute, subset, temporal bound, and quantity against the complete candidate universe; do not substitute a structural proxy.", "When a response contains a pagination cursor, fetch the remaining pages before treating the collection as complete. Re-read mutable collections after changes and use stable IDs rather than stale positions.", "Before an irreversible action or batch commit, inspect current state and the exact API schema; call self-printing documentation directly, map each task constraint to operation parameters, reconcile the container, and verify the postcondition with a documented read.", "After login, extract the access token from the response and pass only that string to protected calls. If a 401 occurs, verify the app-specific identifier and tok