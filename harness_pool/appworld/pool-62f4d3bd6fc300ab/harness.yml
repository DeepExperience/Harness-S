      config: {"context": {"compaction": {"enabled": false, "max_tokens": 4096, "retain_ratio": 0.16, "threshold_ratio": 0.8}, "state_injection": {"max_chars": 1200, "mode": "on_error"}, "tool_result_pruner": {"enabled": false, "head_chars": 4096, "tail_chars": 1024, "threshold_chars": 8192}}, "hooks": [{"action": "warn", "condition": "duplicate_call_gte", "event": "after_tool", "id": "duplicate-execute-guidance", "message": "The same execute call repeated. Use its observed result or change the next call; when a broad API listing is empty, print the catalog and inspect a specific candidate API with api_docs.show_api_doc rather than repeating the listing.", "parameters": {"threshold": 2}}, {"action": "normalize_error", "condition": "last_error_is", "event": "after_tool", "id": "schema-error-recovery", "message": "A schema error occurred. Reopen the exact API schema, correct parameter names, types, required fields, or response extraction, and retry once with the corrected call; do not repeat the same arguments.", "parameters": {"kind": "schema_422"}}, {"action": "normalize_error", "condition": "last_error_is", "event": "after_tool", "id": "authentication-error-recovery", "message": "An authentication error occurred. Verify the app-specific login identifier, extract the access token from the login response, and pass only that token to the protected call; do not reuse the whole login object.", "parameters": {"kind": "authentication_401"}}, {"action": "normalize_error", "condition": "last_error_is", "event": "after_tool", "id": "local-error-recovery", "message": "A local execution error occurred. Read the complete exception, fix the exact variable or API name, and continue with the corrected operation; do not repeat identical code.", "parameters": {"kind": "python_or_api_exception"}}, {"action": "warn", "condition": "pagination_present", "event": "after_tool", "id": "pagination-completion-guidance", "message": "Pagination metadata is present. Continue only until an empty or short page or an authoritative total; do not treat the first page as complete.", "parameters": {}}], "memory": {"enabled": true, "fields": [{"clear": "episode_start", "extractor": "schema_error", "name": "schema_error", "render_label": "Last schema error", "type": "string"}, {"clear": "episode_start", "extractor": "authenticated_apps", "name": "authenticated_apps", "render_label": "Authenticated apps", "type": "string_list"}]}, "tool_view": {"description_suffix": "Use mcp__environment__execute for all AppWorld work. Print exact schemas and used results, target apps from task nouns, finish documented pagination, and refresh mutable state before acting.", "error_normalization": false, "examples": ["Call only mcp__environment__execute. Put AppWorld Python in its code parameter, print the schema before an unfamiliar call, and print every result used for a decision.", "If a collection schema documents page_index or page_limit, fetch the next page whenever a page contains exactly page_limit results; stop only at an empty or short page or an authoritative total.", "Choose apps from task nouns, use only documented filters, and change strategy after an unchanged default result; do not enumerate unrelated apps or brute-force entity IDs.", "Refresh mutable collections before mutation. When removal uses positions, remove in descending order or recompute after each removal; preserve already-resolved entities and contracts."], "helper_tool": false}}
