      config: {"context": {"compaction": {"enabled": false, "max_tokens": 4096, "retain_ratio": 0.16, "threshold_ratio": 0.8}, "state_injection": {"max_chars": 1200, "mode": "on_error"}, "tool_result_pruner": {"enabled": false, "head_chars": 4096, "tail_chars": 1024, "threshold_chars": 8192}}, "hooks": [{"action": "warn", "condition": "duplicate_call_gte", "event": "after_tool", "id": "duplicate-execute-guidance", "message": "The same execute call repeated. Use its observed result or change the next call; when a broad API listing is empty, inspect a specific candidate API with api_docs.show_api_doc rather than repeating the listing.", "parameters": {"threshold": 2}}, {"action": "normalize_error", "condition": "last_error_is", "event": "after_tool", "id": "schema-error-recovery", "message": "A schema error occurred. Reopen the exact API schema, correct parameter names, types, required fields, or response extraction, and retry once with the corrected call; do not repeat the same arguments.", "parameters": {"kind": "schema_422"}}, {"action": "normalize_error", "condition": "last_error_is", "event": "after_tool", "id": "authentication-error-recovery", "message": "An authentication error occurred. Verify the app-specific login identifier, extract the access token from the login response, and pass only that token to the protected call; do not reuse the whole login object.", "parameters": {"kind": "authentication_401"}}, {"action": "normalize_error", "condition": "last_error_is", "event": "after_tool", "id": "local-error-recovery", "message": "A local execution error occurred. Read the complete exception, fix the exact variable or API name, and continue with the corrected operation; do not repeat identical code.", "parameters": {"kind": "python_or_api_exception"}}], "memory": {"enabled": true, "fields": [{"clear": "episode_start", "extractor": "schema_error", "name": "schema_error", "render_label": "Last schema error", "type": "string"}, {"clear": "episode_start", "extractor": "authenticated_apps", "name": "authenticated_apps", "render_label": "Authenticated apps", "type": "string_list"}]}, "tool_view": {"description_suffix": "Use mcp__environment__execute for all AppWorld work; resolve exact schemas, literal output templates, and date or unit boundaries before acting.", "error_normalization": false, "examples": ["Before using an unfamiliar API, read its exact schema. Match parameter names, types, required fields, and response nesting; after a 422 or local error, correct that contract rather than repeating the call.", "When a request gives a literal output path or template, decompose each separator and placeholder before writing. Keep independent scopes separate and verify the final path and content before completion.", "For date or unit comparisons, derive inclusive boundaries from the current date and compare like units. Do not discard a candidate because a response uses a different unit or boundary convention.", "After login, extract the access token from the response and pass only that string to protected calls. If a 401 occurs, verify the app-specific identifier and token before retrying."], "helper_tool": false}}
