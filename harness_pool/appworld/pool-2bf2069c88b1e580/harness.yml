      config: {"context": {"compaction": {"enabled": false, "max_tokens": 4096, "retain_ratio": 0.16, "threshold_ratio": 0.8}, "state_injection": {"max_chars": 1200, "mode": "never"}, "tool_result_pruner": {"enabled": false, "head_chars": 4096, "tail_chars": 1024, "threshold_chars": 8192}}, "hooks": [{"action": "warn", "condition": "duplicate_call_gte", "event": "after_tool", "id": "duplicate-execute-guidance", "message": "The same execute call repeated. Use its observed result or change the next call; when a broad API listing is empty, inspect a specific candidate API with api_docs.show_api_doc rather than repeating the listing.", "parameters": {"threshold": 2}}], "memory": {"enabled": false, "fields": []}, "tool_view": {"description_suffix": "Use mcp__environment__execute for all AppWorld work; resolve operation semantics and exact affected records before mutation.", "error_normalization": false, "examples": ["Use mcp__environment__execute for every AppWorld action. Put Python in its code parameter; never call apis.*, execute, or skill as separate tools. If a broad API listing is empty, call api_docs.show_api_doc for a specific candidate operation instead of repeating it.", "Before creating payment requests, read completed transaction history and exclude participants who already paid. Match participants and amounts; use create_transaction only when the request requires sending money.", "Before updating, disabling, or moving records, enumerate all matching evidence and resolve the exact affected set. Prefer in-place update or disable; use documented delete/create only when the app requires replacement, then verify exact removed, added, and unchanged records."], "helper_tool": false}}
